name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:13.0.2
        env:
          MARIADB_ROOT_PASSWORD: ci-root-${{ github.run_id }}
          MARIADB_DATABASE: shortener
          MARIADB_USER: app
          MARIADB_PASSWORD: ci-app-${{ github.run_id }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: app
      DB_PASSWORD: ci-app-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python python/demo.py --rows 200 --runs 1
